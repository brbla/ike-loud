[workspace]
resolver = "3"
members = [
    "crates/ikeloud-api",
    "crates/ikeloud-sync",
    "crates/ikeloud-safety",
    "crates/ikeloud-daemon",
    "crates/ikeloud-gui",
    "crates/ikeloud-cli",
    "crates/ikeloud-i18n",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brbla/ike-loud"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Spec: no unwrap(), expect() or panic! in production code.
# clippy.toml allows them in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

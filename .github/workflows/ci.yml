name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # CI tools are pinned exactly; update deliberately, one per change.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_VET_VERSION: 0.10.2

# Caching (docs/rozhodnuti/0008, .claude/skills/ci-cache/SKILL.md):
# - Only things that did not change are cached: compiled third-party
#   dependencies from vendor/ and pinned tools.
# - The dependency cache key is the fingerprint of every input of the cached
#   artifacts, computed by scripts/ci-cache-key.sh; scripts/test-cache-key.sh
#   proves that every input changes the key.
# - Our own crates are never taken from the cache: their artifacts are
#   removed after restoring and before saving, and scripts/check-fresh.py
#   fails the build if any of them was not compiled from current sources.
# - Exact keys only (no restore-keys), so an older cache is never reused.
# - Test and model-checking results are never cached.
# Actions are pinned to commit SHAs.

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Cargo decides whether a dependency with a build script changed by file
      # mtimes, and a fresh checkout makes every file new. vendor/ content is
      # covered by the cache key (all .cargo-checksum.json files), so a fixed
      # mtime is safe there. Our own sources keep their real mtimes.
      - name: Fixed mtime for vendored sources
        run: find vendor -exec touch -h -d '2000-01-01T00:00:00Z' {} +

      - name: Fingerprint of the dependency cache inputs
        id: key
        run: |
          scripts/ci-cache-key.sh --explain | grep -v '^file vendor'
          echo "key=$(scripts/ci-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: The fingerprint covers every input
        run: scripts/test-cache-key.sh

      - name: Restore compiled dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.key.outputs.key }}

      - name: Drop our own crates from the cache
        run: scripts/ci-clean-workspace.sh

      - name: Build and check our crates are compiled fresh
        run: |
          set -o pipefail
          cargo test --workspace --locked --offline --no-run --message-format=json-render-diagnostics \
            | scripts/check-fresh.py ${{ steps.deps.outputs.cache-hit == 'true' && '--expect-deps-cached' || '' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --offline

      - name: Dependency rules
        run: python3 scripts/check-deps.py

      - name: Keep only dependencies for the cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/ci-clean-workspace.sh

      - name: Save compiled dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.key.outputs.key }}

  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java and tla2tools; versions and checksums live in scripts/tlc.sh,
      # which also verifies the jar on every run.
      - name: Cache Java and TLC
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/jre-*
            .tools/tla2tools-*.jar
          key: tla-tools-v1-${{ runner.os }}-${{ hashFiles('scripts/tlc.sh') }}

      - name: TLA+ sync model (server enforces etag)
        run: scripts/tlc.sh SyncEtag.cfg

      - name: TLA+ model of moves
        run: scripts/tlc.sh SyncMoves.cfg

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tools are built with the runner's default Rust outside the
      # repository (inside it .cargo/config.toml redirects crates.io to vendor/).
      - name: Rust version and runner image for the tool cache
        id: rust
        working-directory: ${{ runner.temp }}
        run: |
          echo "rustc=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-deny, cargo-audit and cargo-vet
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-vet
          key: supply-chain-tools-v2-${{ steps.rust.outputs.image }}-${{ steps.rust.outputs.rustc }}-deny${{ env.CARGO_DENY_VERSION }}-audit${{ env.CARGO_AUDIT_VERSION }}-vet${{ env.CARGO_VET_VERSION }}

      - name: Install cargo-deny, cargo-audit and cargo-vet
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"

      - name: Tool versions match the pins
        run: |
          cargo deny --version | grep -qF "$CARGO_DENY_VERSION"
          cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"
          cargo vet --version | grep -qF "$CARGO_VET_VERSION"

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      # We trust nobody (docs/rozhodnuti/0007): no third-party audits or publishers.
      - name: cargo vet without third-party trust
        run: |
          if grep -nE '^\[(imports|trusted)' supply-chain/config.toml supply-chain/audits.toml; then
            echo "error: supply-chain contains imports or trusted publishers" >&2
            exit 1
          fi
          cargo vet --locked

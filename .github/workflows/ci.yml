name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Nástroje CI jsou připnuté přesně; aktualizace jen záměrně, jedna na změnu.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_VET_VERSION: 0.10.2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain z rust-toolchain.toml
        run: rustup toolchain install

      - name: Formát
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Testy
        run: cargo test --workspace --locked --offline

      - name: Pravidla závislostí
        run: python3 scripts/check-deps.py

  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: TLA+ model synchronizace (server vynucuje etag)
        run: scripts/tlc.sh SyncEtag.cfg

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Mimo repozitář: v něm .cargo/config.toml přesměruje crates.io na vendor/.
      - name: Instalace cargo-deny, cargo-audit a cargo-vet
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      - name: cargo vet
        run: cargo vet --locked

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # CI tools are pinned exactly in the job that uses them (so a tool update
  # does not change the dependency cache key); update deliberately, one per
  # change.

# Caching (docs/rozhodnuti/0008, .claude/skills/ci-cache/SKILL.md):
# - Only things that did not change are cached: compiled third-party
#   dependencies from vendor/ and pinned tools.
# - The dependency cache key is the fingerprint of every input of the cached
#   artifacts, computed by scripts/ci-cache-key.sh; scripts/test-cache-key.sh
#   proves that every input changes the key.
# - Our own crates are never taken from the cache: their artifacts are
#   removed after restoring and before saving, and scripts/check-fresh.py
#   fails the build if any of them was not compiled from current sources.
# - Exact keys only (no restore-keys), so an older cache is never reused.
# - Test and model-checking results are never cached, with one exception:
#   a passed mutation run and passed Kani proofs of the safety layer, each
#   under the fingerprint of every input of that run (scripts/ci-cache-key.sh --mutants, tested by
#   scripts/test-cache-key.sh). Any change to the safety crate runs it again.
# Actions are pinned to commit SHAs.

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Cargo decides whether a dependency with a build script changed by file
      # mtimes, and a fresh checkout makes every file new. vendor/ content is
      # covered by the cache key (all .cargo-checksum.json files), so a fixed
      # mtime is safe there. Our own sources keep their real mtimes.
      - name: Fixed mtime for vendored sources
        run: find vendor -exec touch -h -d '2000-01-01T00:00:00Z' {} +

      - name: Fingerprint of the dependency cache inputs
        id: key
        run: |
          scripts/ci-cache-key.sh --explain | grep -v '^file vendor'
          echo "key=$(scripts/ci-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: The fingerprint covers every input
        run: scripts/test-cache-key.sh

      - name: Restore compiled dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.key.outputs.key }}

      - name: Drop our own crates from the cache
        run: scripts/ci-clean-workspace.sh

      - name: Build and check our crates are compiled fresh
        run: |
          set -o pipefail
          cargo test --workspace --locked --offline --no-run --message-format=json-render-diagnostics \
            | scripts/check-fresh.py ${{ steps.deps.outputs.cache-hit == 'true' && '--expect-deps-cached' || '' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --offline

      - name: Dependency rules
        run: python3 scripts/check-deps.py

      - name: Keep only dependencies for the cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/ci-clean-workspace.sh

      - name: Save compiled dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.key.outputs.key }}

  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java and tla2tools; versions and checksums live in scripts/tlc.sh,
      # which also verifies the jar on every run.
      - name: Cache Java and TLC
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/jre-*
            .tools/tla2tools-*.jar
          key: tla-tools-v1-${{ runner.os }}-${{ hashFiles('scripts/tlc.sh') }}

      - name: TLA+ sync model (server enforces etag)
        run: scripts/tlc.sh SyncEtag.cfg

      - name: TLA+ model of moves
        run: scripts/tlc.sh SyncMoves.cfg

  supply-chain:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_VET_VERSION: 0.10.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tools are built with the runner's default Rust outside the
      # repository (inside it .cargo/config.toml redirects crates.io to vendor/).
      # Their cache key comes from the same script as the dependency cache.
      - name: Fingerprint of the tool cache inputs
        id: tools-key
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-cache-key.sh" --tools supply-chain --explain
          echo "key=$("$GITHUB_WORKSPACE/scripts/ci-cache-key.sh" --tools supply-chain)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-deny, cargo-audit and cargo-vet
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-vet
          key: ${{ steps.tools-key.outputs.key }}

      - name: Install cargo-deny, cargo-audit and cargo-vet
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"

      - name: Tool versions match the pins
        run: |
          cargo deny --version | grep -qF "$CARGO_DENY_VERSION"
          cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"
          cargo vet --version | grep -qF "$CARGO_VET_VERSION"

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      # We trust nobody (docs/rozhodnuti/0007): no third-party audits or publishers.
      - name: cargo vet without third-party trust
        run: |
          if grep -nE '^\[(imports|trusted)' supply-chain/config.toml supply-chain/audits.toml; then
            echo "error: supply-chain contains imports or trusted publishers" >&2
            exit 1
          fi
          cargo vet --locked

  # Coverage and mutation testing (spec, chapter Testing): what the tests are
  # worth, not only whether they pass.
  quality:
    runs-on: ubuntu-24.04
    env:
      CARGO_LLVM_COV_VERSION: 0.9.1
      CARGO_MUTANTS_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml, with llvm-tools for coverage
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Fingerprint of the tool cache inputs
        id: tools-key
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-cache-key.sh" --tools quality --explain
          echo "key=$("$GITHUB_WORKSPACE/scripts/ci-cache-key.sh" --tools quality)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-llvm-cov and cargo-mutants
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-mutants
          key: ${{ steps.tools-key.outputs.key }}

      - name: Install cargo-llvm-cov and cargo-mutants
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
          cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"

      - name: Tool versions match the pins
        run: |
          cargo llvm-cov --version | grep -qF "$CARGO_LLVM_COV_VERSION"
          cargo mutants --version | grep -qF "$CARGO_MUTANTS_VERSION"

      # Spec: at least 90 % for ikeloud-safety and ikeloud-sync. The bar is
      # set where the code is (98 %), so coverage cannot quietly drop.
      - name: Coverage of ikeloud-safety and ikeloud-sync (at least 95 % of lines)
        run: |
          cargo llvm-cov --package ikeloud-safety --package ikeloud-sync \
            --locked --offline --summary-only --fail-under-lines 95

      - name: Fingerprint of the mutation run inputs
        id: mutants-key
        run: |
          scripts/ci-cache-key.sh --mutants --explain
          echo "key=$(scripts/ci-cache-key.sh --mutants)" >> "$GITHUB_OUTPUT"

      - name: Did this exact safety layer already pass?
        id: mutants-passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutants-passed
          key: ${{ steps.mutants-key.outputs.key }}

      - name: Mutation testing of ikeloud-safety (no mutant may survive)
        if: steps.mutants-passed.outputs.cache-hit != 'true'
        run: |
          scripts/mutants.sh
          echo "${{ steps.mutants-key.outputs.key }}" > .mutants-passed

      - name: Remember the passed mutation run
        if: steps.mutants-passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutants-passed
          key: ${{ steps.mutants-key.outputs.key }}

  # Kani proofs of the safety layer (crates/ikeloud-safety/src/proofs.rs).
  # Installing Kani is heavy (a 140 MB bundle and its own toolchain), so
  # everything is skipped while the safety layer is unchanged since the last
  # passed run.
  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Fingerprint of the proof inputs
        id: kani-key
        run: |
          scripts/ci-cache-key.sh --kani --explain
          echo "key=$(scripts/ci-cache-key.sh --kani)" >> "$GITHUB_OUTPUT"

      - name: Did this exact safety layer already pass?
        id: kani-passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kani-passed
          key: ${{ steps.kani-key.outputs.key }}

      - name: Install Kani (pinned version, verified bundle)
        if: steps.kani-passed.outputs.cache-hit != 'true'
        run: scripts/kani-setup.sh

      - name: Kani proofs
        if: steps.kani-passed.outputs.cache-hit != 'true'
        run: |
          scripts/kani.sh
          echo "${{ steps.kani-key.outputs.key }}" > .kani-passed

      - name: Remember the passed proofs
        if: steps.kani-passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kani-passed
          key: ${{ steps.kani-key.outputs.key }}

[package]
name = "ikeloud-api"
description = "iCloud web services client: sign-in, listing, transfers, trash."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# SRP-6a sign-in, Apple variant (src/srp.rs wraps all four).
num-bigint = { version = "=0.4.6", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
getrandom = { version = "=0.3.4", default-features = false }

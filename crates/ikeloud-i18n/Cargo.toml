[package]
name = "ikeloud-i18n"
description = "ike loud translations: message keys and Fluent text files for any language."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ikeloud-safety = { path = "../ikeloud-safety" }
# Fluent (Mozilla): translations with Czech plural forms. Single wrapper.
fluent-bundle = { version = "=0.16.0", default-features = false }
unic-langid = { version = "=0.9.6", default-features = false }

[dev-dependencies]
ikeloud-sync = { path = "../ikeloud-sync" }

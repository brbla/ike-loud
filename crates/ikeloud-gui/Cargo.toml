[package]
name = "ikeloud-gui"
description = "ike loud user interface: setup assistant, status window, notifications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ikeloud-api = { path = "../ikeloud-api" }
ikeloud-config = { path = "../ikeloud-config" }
ikeloud-keyring = { path = "../ikeloud-keyring" }
ikeloud-i18n = { path = "../ikeloud-i18n" }
# Plain GTK 4 (decision 0022): follows the desktop's GTK theme. GLib and GIO
# come through gtk4's re-exports (gtk::glib, gtk::gio): D-Bus for the tray.
gtk = { package = "gtk4", version = "=0.11.5", default-features = false, features = ["v4_12"] }

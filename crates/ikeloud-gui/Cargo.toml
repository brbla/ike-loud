[package]
name = "ikeloud-gui"
description = "ike loud user interface: setup assistant, status window, notifications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ikeloud-api = { path = "../ikeloud-api" }
ikeloud-config = { path = "../ikeloud-config" }
ikeloud-i18n = { path = "../ikeloud-i18n" }
# GTK 4 and libadwaita (decision 0022). GLib and GIO come through gtk4's
# re-exports (gtk::glib, gtk::gio): D-Bus for the tray icon and notifications.
gtk = { package = "gtk4", version = "=0.11.5", default-features = false, features = ["v4_12"] }
adw = { package = "libadwaita", version = "=0.9.2", default-features = false, features = ["v1_5"] }

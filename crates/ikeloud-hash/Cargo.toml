[package]
name = "ikeloud-hash"
description = "Hash functions of ike loud: SHA-256 (content hashes, SRP), iCloud's content checksum (SHA-1) and PBKDF2. Single wrapper of sha2, sha1 and pbkdf2."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }

# Which dependencies each crate may have. Checked by scripts/check-deps.py in CI.
#
# Rules (spec, chapter on third-party code):
# - A third-party library is called by one crate only, its wrapper. So every
#   external crate may appear in `external` of at most one workspace crate.
# - ikeloud-safety uses nothing but the standard library.
# - The path to the server goes only through ikeloud-safety: ikeloud-sync does
#   not depend on ikeloud-api and writes in ikeloud-api need an approval from safety.
#
# New dependency = a new line here with the reason in a comment.
# `dev` applies to tests only and the single-wrapper rule does not apply to it.
# A crate with `test_only = true` may only be a dev dependency.

[crates.ikeloud-safety]
internal = []
external = []
dev = []

[crates.ikeloud-api]
internal = ["ikeloud-safety", "ikeloud-hash"]
# SRP-6a: big numbers and the random client secret (src/srp.rs).
# ureq: HTTPS to the iCloud web services over rustls with compiled-in root
# certificates; serde, serde_json: their JSON bodies (decision 0021).
external = ["num-bigint", "getrandom", "ureq", "serde", "serde_json"]
dev = []

[crates.ikeloud-sync]
internal = ["ikeloud-safety"]
# unicode-normalization: comparing names after NFC (spec, rules for names)
external = ["unicode-normalization"]
dev = ["ikeloud-testkit"]

[crates.ikeloud-daemon]
# ikeloud-i18n: translated names of conflict copies; ikeloud-config: paths,
# settings and the status file shared with the GUI.
internal = ["ikeloud-api", "ikeloud-sync", "ikeloud-safety", "ikeloud-local", "ikeloud-state", "ikeloud-hash", "ikeloud-i18n", "ikeloud-config"]
external = []
dev = ["ikeloud-testkit"]

# The app: first-run setup (sign-in, SMS code, folder), status window, tray
# icon. Plain gtk4 (decision 0022); GLib/GIO through gtk4's re-exports
# (D-Bus for the tray icon). Signs in with ikeloud-api and hands the session
# to the daemon through the files of ikeloud-config.
[crates.ikeloud-gui]
internal = ["ikeloud-api", "ikeloud-config", "ikeloud-i18n"]
external = ["gtk4"]
dev = []

[crates.ikeloud-cli]
internal = ["ikeloud-api", "ikeloud-config"]
external = []
dev = []

# Translations: single wrapper of the Fluent libraries. Depends on safety to turn
# defer reasons and rejections into message keys; safety itself has no dependencies.
[crates.ikeloud-i18n]
internal = ["ikeloud-safety"]
external = ["fluent-bundle", "unic-langid"]
# ikeloud-sync only in the test of the planner with a translated copy name.
dev = ["ikeloud-sync", "ikeloud-testkit"]

# Persistent state: single wrapper of rusqlite (SQLite bundled in a fixed version).
[crates.ikeloud-state]
internal = ["ikeloud-safety", "ikeloud-sync"]
external = ["rusqlite"]
dev = ["ikeloud-testkit"]

# Hash functions: single wrapper of sha2 and pbkdf2, used by the sign-in
# (ikeloud-api) and the local scanner (content hashes).
[crates.ikeloud-hash]
internal = []
external = ["sha2", "pbkdf2"]
dev = []

# The local side: scanning and watching the synced folder. Content hashes
# through ikeloud-hash; inotify: change hints from the kernel (src/watch.rs),
# std has no inotify and our code has no `unsafe`.
[crates.ikeloud-local]
internal = ["ikeloud-safety", "ikeloud-sync", "ikeloud-hash"]
external = ["inotify"]
dev = []

# Builders of test data shared by the tests of several crates. `test_only`:
# no crate may have it as a normal dependency.
[crates.ikeloud-testkit]
test_only = true
internal = ["ikeloud-safety", "ikeloud-sync"]
external = []
dev = []

# Paths, settings and the status file shared by the daemon, the GUI and the
# CLI. Standard library only.
[crates.ikeloud-config]
internal = []
external = []
dev = []

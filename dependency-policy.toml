# Which dependencies each crate may have. Checked by scripts/check-deps.py in CI.
#
# Rules (spec, chapter on third-party code):
# - A third-party library is called by one crate only, its wrapper. So every
#   external crate may appear in `external` of at most one workspace crate.
# - ikeloud-safety uses nothing but the standard library.
# - The path to the server goes only through ikeloud-safety: ikeloud-sync does
#   not depend on ikeloud-api and writes in ikeloud-api need an approval from safety.
#
# New dependency = a new line here with the reason in a comment.
# `dev` applies to tests only and the single-wrapper rule does not apply to it.

[crates.ikeloud-safety]
internal = []
external = []
dev = []

[crates.ikeloud-api]
internal = ["ikeloud-safety"]
# SRP-6a: big numbers, SHA-256, PBKDF2 and the random client secret (src/srp.rs)
external = ["num-bigint", "sha2", "pbkdf2", "getrandom"]
dev = []

[crates.ikeloud-sync]
internal = ["ikeloud-safety"]
# unicode-normalization: comparing names after NFC (spec, rules for names)
external = ["unicode-normalization"]
dev = []

[crates.ikeloud-daemon]
internal = ["ikeloud-api", "ikeloud-sync", "ikeloud-safety"]
external = []
dev = []

[crates.ikeloud-gui]
internal = []
external = []
dev = []

[crates.ikeloud-cli]
internal = ["ikeloud-api"]
external = []
dev = []

# Translations: single wrapper of the Fluent libraries. Depends on safety to turn
# defer reasons and rejections into message keys; safety itself has no dependencies.
[crates.ikeloud-i18n]
internal = ["ikeloud-safety"]
external = ["fluent-bundle", "unic-langid"]
# ikeloud-sync only in the test of the planner with a translated copy name.
dev = ["ikeloud-sync"]

# Persistent state: single wrapper of rusqlite (SQLite bundled in a fixed version).
[crates.ikeloud-state]
internal = ["ikeloud-safety", "ikeloud-sync"]
external = ["rusqlite"]
dev = []
